[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varmc"
version = "1.0.0"
description = "VaR et Expected Shortfall d'un portefeuille de devises : simulation historique, variance-covariance, Monte Carlo et backtesting"
authors = [{ name = "Maxime Fruntes" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
